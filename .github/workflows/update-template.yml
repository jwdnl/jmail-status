# Automatic regeneration would overwrite the reviewed action SHA pins.
# Apply future Upptime workflow updates through a reviewed repository change.
name: Update Template CI
on:
  workflow_dispatch:
permissions: {}
jobs:
  notice:
    name: Template regeneration paused
    runs-on: ubuntu-latest
    steps:
      - name: Explain manual maintenance
        run: echo "Automatic template regeneration is paused. Review Upptime workflow updates and preserve action SHA pins and explicit secrets allowlists."
